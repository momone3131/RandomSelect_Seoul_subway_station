<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Random Seoul Responsive Smoke</title>
</head>
<body>
  <div class="hero-title-row">
    <h1>이 코스로 가자!</h1>
    <button class="hero-visit-btn" type="button">등록</button>
  </div>
  <section class="draw-shell" data-stage="done">
    <div class="restaurant-request">
      <button class="restaurant-request-btn" id="responsive_restaurant_request" type="button">추천 식당 보기</button>
    </div>
    <div class="action-zone">
      <button class="draw-btn" id="responsive_new_course" type="button">새 코스</button>
    </div>
  </section>
  <details class="station-detail" open>
    <summary>2호선 역 목록</summary>
  </details>
  <div class="visit-tools" id="responsive_visit_tools">
    <button class="visit-tool-btn" type="button">발자취 노선도</button>
    <button class="visit-tool-btn" type="button">방문 통계</button>
  </div>
  <section class="restaurant-section">
    <div class="restaurant-grid" id="responsive_restaurant_grid">
      <article class="restaurant-card"><h3 class="restaurant-name">식당 A</h3><div class="restaurant-meta"><span class="restaurant-rating">★ 4.7</span><span class="restaurant-reviews">평가 100개</span><span class="restaurant-distance">역에서 500m</span></div><a class="restaurant-map-link" href="#">구글지도에서 보기</a></article>
      <article class="restaurant-card"><h3 class="restaurant-name">식당 B</h3></article>
      <article class="restaurant-card"><h3 class="restaurant-name">식당 C</h3></article>
    </div>
  </section>
  <script type="module" src="/src/testing/responsive-smoke.ts"></script>
</body>
</html>
