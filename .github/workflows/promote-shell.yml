name: Promote modular visual shell

on:
  push:
    branches:
      - refactor/random-seoul-core
    paths:
      - scripts/promote-legacy-shell.mjs
      - .github/workflows/promote-shell.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/random-seoul-core

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate permanent modular assets
        run: node scripts/promote-legacy-shell.mjs

      - name: Commit promoted assets when changed
        shell: bash
        run: |
          if git diff --quiet -- src/ui/styles.css src/ui/shell.html; then
            echo "No visual-shell changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/styles.css src/ui/shell.html
          git commit -m "refactor: promote stable visual shell into modular assets [skip ci]"
          git push origin HEAD:refactor/random-seoul-core
