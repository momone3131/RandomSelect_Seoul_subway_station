name: Scaffold Android project

on:
  push:
    branches:
      - feature/random-seoul-android
    paths:
      - capacitor.config.ts
      - package.json
      - native/index.html
      - vite.native.config.ts
      - .github/workflows/scaffold-android.yml

permissions:
  contents: write

jobs:
  scaffold:
    if: ${{ !contains(github.event.head_commit.message, '[android-scaffold]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/random-seoul-android

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build native web assets
        run: npm run build:native

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Commit generated Android project and lockfile
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- android package-lock.json)" ]; then
            echo "Android scaffold already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android package-lock.json
          git commit -m "android: generate Capacitor project [android-scaffold]"
          git push origin HEAD:feature/random-seoul-android
