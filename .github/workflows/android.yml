name: Android CI

on:
  push:
    branches:
      - feature/random-seoul-android
    paths:
      - 'android/**'
      - 'native/**'
      - 'src/**'
      - 'tests/**'
      - 'capacitor.config.ts'
      - 'vite.native.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'native/**'
      - 'src/**'
      - 'tests/**'
      - 'capacitor.config.ts'
      - 'vite.native.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      RANDOM_SEOUL_PLACES_API_KEY: ${{ secrets.RANDOM_SEOUL_PLACES_API_KEY || 'DEFAULT_API_KEY' }}
      RANDOM_SEOUL_DEV_KEYSTORE_BASE64: ${{ secrets.RANDOM_SEOUL_DEV_KEYSTORE_BASE64 }}
      RANDOM_SEOUL_DEV_STORE_PASSWORD: ${{ secrets.RANDOM_SEOUL_DEV_STORE_PASSWORD }}
      RANDOM_SEOUL_DEV_KEY_ALIAS: ${{ secrets.RANDOM_SEOUL_DEV_KEY_ALIAS }}
      RANDOM_SEOUL_DEV_KEY_PASSWORD: ${{ secrets.RANDOM_SEOUL_DEV_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install JS dependencies
        run: npm ci

      - name: Run shared tests
        run: npm test

      - name: Build native Web assets
        run: npm run build:native

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure stable development signing when available
        shell: bash
        run: |
          if [ -n "$RANDOM_SEOUL_DEV_KEYSTORE_BASE64" ] && \
             [ -n "$RANDOM_SEOUL_DEV_STORE_PASSWORD" ] && \
             [ -n "$RANDOM_SEOUL_DEV_KEY_ALIAS" ] && \
             [ -n "$RANDOM_SEOUL_DEV_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/random-seoul-dev.jks"
            printf '%s' "$RANDOM_SEOUL_DEV_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "RANDOM_SEOUL_DEV_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "Stable development signing is configured."
          else
            echo "Stable development signing secrets are not configured; using the runner's default debug signing key."
          fi

      - name: Report Places key mode
        shell: bash
        run: |
          if [ "$RANDOM_SEOUL_PLACES_API_KEY" = "DEFAULT_API_KEY" ]; then
            echo "Android Places key is not configured; APK will build but restaurant search will remain disabled."
          else
            echo "Android Places key secret is configured."
          fi

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Report Android debug certificate fingerprint
        shell: bash
        run: |
          if [ -n "${RANDOM_SEOUL_DEV_KEYSTORE_PATH:-}" ]; then
            SHA1=$(keytool -list -v \
              -keystore "$RANDOM_SEOUL_DEV_KEYSTORE_PATH" \
              -storepass "$RANDOM_SEOUL_DEV_STORE_PASSWORD" \
              -alias "$RANDOM_SEOUL_DEV_KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}')
            echo "Stable debug SHA-1: $SHA1"
            {
              echo "### Android development signing"
              echo "- Package: \`io.github.momone3131.randomseoul\`"
              echo "- Stable debug SHA-1: \`$SHA1\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No stable development keystore is configured. The default CI debug certificate is not suitable for a long-lived Google API Android restriction."
            {
              echo "### Android development signing"
              echo "- Stable development keystore: not configured"
              echo "- Add the four RANDOM_SEOUL_DEV_* secrets before relying on a SHA-1 application restriction."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare easy-download APK
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk random-seoul-latest.apk
          sha256sum random-seoul-latest.apk > random-seoul-latest.apk.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-seoul-debug-apk
          path: |
            random-seoul-latest.apk
            random-seoul-latest.apk.sha256
          if-no-files-found: error

      - name: Publish fixed latest-development release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/random-seoul-android'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-dev-latest "$GITHUB_SHA"
          git push --force origin refs/tags/android-dev-latest

          NOTES=$(cat <<EOF
          Latest Random Seoul Android development APK.

          Source branch: feature/random-seoul-android
          Source commit: $GITHUB_SHA
          Build: debug/development APK

          The fixed download asset is random-seoul-latest.apk. Each successful branch build replaces the previous APK.
          EOF
          )

          if gh release view android-dev-latest >/dev/null 2>&1; then
            gh release edit android-dev-latest \
              --title 'Random Seoul — Latest Android Dev APK' \
              --notes "$NOTES"
          else
            gh release create android-dev-latest \
              --verify-tag \
              --title 'Random Seoul — Latest Android Dev APK' \
              --notes "$NOTES"
          fi

          gh release upload android-dev-latest \
            random-seoul-latest.apk \
            random-seoul-latest.apk.sha256 \
            --clobber

          {
            echo '### Latest Android APK'
            echo '- Release: https://github.com/momone3131/RandomSelect_Seoul_subway_station/releases/tag/android-dev-latest'
            echo '- Direct APK: https://github.com/momone3131/RandomSelect_Seoul_subway_station/releases/download/android-dev-latest/random-seoul-latest.apk'
          } >> "$GITHUB_STEP_SUMMARY"
